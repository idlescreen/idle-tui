[package]
name = "trance-tui"
version = "2.0.1"
edition = "2024"
description = "Optional TUI client for IdleScreen daemon configuration (app-tui)"
license = "Apache-2.0"
repository = "https://github.com/idlescreen/app-tui"
readme = "README.md"
publish = false

[[bin]]
name = "app-tui"
path = "src/main.rs"

[[bin]]
name = "idlescreen-tui"
path = "src/main.rs"

[[bin]]
name = "trance-tui"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
anyhow = "1"
trance-dbus = { path = "../idle-core/crates/trance-dbus" }
trance-runner = { path = "../idle-core/trance-runner" }

[package.metadata.deb]
name = "app-tui"
copyright = "2026 IdleScreen"
maintainer = "IdleScreen <jerydleuck@gmail.com>"
extended-description = "Optional live TUI controller for IdleScreen (app-tui product)."
depends = "libc6, idlescreen"
provides = "idlescreen-tui, trance-tui"
replaces = "idlescreen-tui, trance-tui"
conflicts = "idlescreen-tui (<< 2.0.1), trance-tui (<< 2.0.0)"
section = "utils"
priority = "optional"
assets = [
    ["target/release/app-tui", "usr/bin/app-tui", "755"],
    ["target/release/idlescreen-tui", "usr/bin/idlescreen-tui", "755"],
    ["target/release/trance-tui", "usr/bin/trance-tui", "755"]
]

[package.metadata.generate-rpm]
name = "app-tui"
release = "1"
arch = "x86_64"
summary = "IdleScreen live TUI controller"
description = "Optional live TUI controller for IdleScreen."
license = "Apache-2.0"
assets = [
    { source = "target/release/app-tui", dest = "/usr/bin/app-tui", mode = "755" },
    { source = "target/release/idlescreen-tui", dest = "/usr/bin/idlescreen-tui", mode = "755" },
    { source = "target/release/trance-tui", dest = "/usr/bin/trance-tui", mode = "755" }
]

[package.metadata.generate-rpm.requires]
idlescreen = "*"

[package.metadata.generate-rpm.provides]
idlescreen-tui = "*"
trance-tui = "*"

[package.metadata.generate-rpm.obsoletes]
idlescreen-tui = "*"
trance-tui = "*"
