name: Standard CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Checkout runtime engine (path deps)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: idlescreen/runtime
        path: runtime

    - name: Install build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y cargo rustc \
          libwayland-dev libxkbcommon-dev libudev-dev \
          libdbus-1-dev pkg-config libssl-dev \
          libfontconfig1-dev libfreetype6-dev

    - name: cargo build
      run: cargo build --workspace --all-targets

    - name: cargo test
      run: cargo test --workspace --all-targets

    - name: cargo clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: cargo audit (advisories)
      run: |
        curl -L --proto '=https' --tlsv1.2 -sSf \
          https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        cargo binstall -y cargo-audit
        cargo audit

    - name: cargo fmt check
      run: cargo fmt --all -- --check