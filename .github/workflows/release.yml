name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout idle engine (path deps)
        uses: actions/checkout@v4
        with:
          repository: idlescreen/idle
          path: idle
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build release
        run: cargo build --release
      - name: Upload binary
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/idle-tui
            target/release/trance-tui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
