name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout runtime engine (path deps)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: idlescreen/runtime
          path: runtime

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev pkg-config libwayland-dev libxkbcommon-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-deb cargo-generate-rpm

      - name: Build release
        run: cargo build --release

      - name: Package
        run: |
          cargo deb --no-build
          cargo generate-rpm

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Tag arrives via env, never expression interpolation into shell.
          case "$RELEASE_TAG" in
            ""|*[!A-Za-z0-9._-]*) echo "ERROR: invalid release tag '$RELEASE_TAG'" >&2; exit 1 ;;
          esac
          [ "${#RELEASE_TAG}" -le 64 ] || { echo "ERROR: tag too long" >&2; exit 1; }
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "idle-tui release $RELEASE_TAG" \
            target/debian/*.deb \
            target/generate-rpm/*.rpm \
            target/release/idle-tui

      - name: Trigger packages import
        env:
          GH_TOKEN: ${{ secrets.IDLESCREEN_PACKAGES_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          DISPATCH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::IDLESCREEN_PACKAGES_DISPATCH_TOKEN is not set — packages repo will not update"
            exit 1
          fi
          gh api repos/idlescreen/packages/dispatches \
            -X POST \
            -f event_type=new_release \
            -f "client_payload[repo]=${DISPATCH_REPO}" \
            -f "client_payload[tag]=${RELEASE_TAG}"
