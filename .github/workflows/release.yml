name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout idle engine (path deps)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: idlescreen/idle
          path: idle

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev pkg-config libwayland-dev libxkbcommon-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-deb cargo-generate-rpm

      - name: Build release
        run: cargo build --release

      - name: Package
        run: |
          cargo deb --no-build
          cargo generate-rpm

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "idle-tui release ${{ github.ref_name }}" \
            target/debian/*.deb \
            target/generate-rpm/*.rpm \
            target/release/idle-tui

      - name: Trigger packages import
        env:
          DISPATCH_TOKEN: ${{ secrets.IDLESCREEN_PACKAGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::IDLESCREEN_PACKAGES_DISPATCH_TOKEN is not set — packages repo will not update"
            exit 1
          fi
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/idlescreen/packages/dispatches \
            -d "{\"event_type\": \"new_release\", \"client_payload\": {\"repo\": \"${{ github.repository }}\", \"tag\": \"${{ github.ref_name }}\"}}"
